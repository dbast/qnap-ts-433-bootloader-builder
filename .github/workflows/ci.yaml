on:
  push:
    branches:
      - main
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9]*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag to upgrade and publish
        required: false
        type: string

name: CI

env:
  # renovate: datasource=pypi depName=opentimestamps-client
  OPENTIMESTAMPS_VERSION: 0.7.2
  REPOSITORY: ${{ github.repository }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
  build:
    name: Build
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Enable binfmt
        run: |
          make enable-binfmt
      - name: Patch rkbin
        run: |
          make patch-rkbin
      - name: Create SPL Loader
        run: |
          make spl-loader
      - name: Unpatch rkbin
        run: |
          make unpatch-rkbin
      - name: Create container
        run: |
          make build-image
      - name: Build tf-a
        run: |
          make build-bl31
      - name: Build U-Boot
        run: |
          make build-u-boot-tf-a
      - name: Collect licenses
        run: |
          make licenses
      - name: Package bundle
        run: |
          make package
      - name: Store result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: |
            artifacts/**
            dist/**
          retention-days: 2

  draft-release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [prek, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the draft release and upload its assets.
      id-token: write # Sign the release bundle with Sigstore.
      attestations: write # Store the build provenance attestation.
    steps:
      - name: Download result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts
      - name: Sign release bundle
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*.zip
          release-signing-artifacts: false
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
      - name: Install OpenTimestamps
        run: |
          python3 -m venv "$RUNNER_TEMP/ots"
          "$RUNNER_TEMP/ots/bin/pip" install "opentimestamps-client==$OPENTIMESTAMPS_VERSION"
          echo "$RUNNER_TEMP/ots/bin" >> "$GITHUB_PATH"
      - name: Timestamp release bundle
        run: |
          ots stamp dist/*.zip
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/u-boot-rockchip-*.bin
            dist/*.zip
      - name: Store provenance
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for zip in dist/*.zip; do cp "$BUNDLE_PATH" "$zip.intoto.jsonl"; done
      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundles=(dist/*.zip)
          test "${#bundles[@]}" -eq 1
          BUNDLE=${bundles[0]##*/}
          read -r SHA256 _ < "dist/$BUNDLE.sha256"
          GENERATED_NOTES=$(gh api --method POST "repos/$REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body)
          FULL_CHANGELOG=
          while IFS= read -r line; do
            if [[ $line == "**Full Changelog**:"* ]]; then
              FULL_CHANGELOG=$line
            else
              printf '%s\n' "$line"
            fi
          done <<< "$GENERATED_NOTES" > release-notes.md
          cat >> release-notes.md <<EOF

          ### Verify and install

          - [Verify the release bundle](https://github.com/$REPOSITORY/blob/$RELEASE_TAG/README.md#release-verification)
          - [Flash the bootloader](https://github.com/$REPOSITORY/blob/$RELEASE_TAG/README.md#flashing)
          - [Check the installed version](https://github.com/$REPOSITORY/blob/$RELEASE_TAG/README.md#checking-the-installed-version)

          The installed builder version should end in \`builder-$RELEASE_TAG\`.

          VirusTotal file scan:
          [![VirusTotal file scan](https://badges.cssnr.com/vt/id/$SHA256)](https://www.virustotal.com/gui/file/$SHA256)

          $FULL_CHANGELOG
          EOF
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$IS_DRAFT" = true
            gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --draft
          fi
      - name: Upload draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >
          gh release upload
          --clobber "$RELEASE_TAG"
          --repo "$REPOSITORY"
          dist/*.zip dist/*.zip.sha256 dist/*.zip.sigstore.json dist/*.zip.ots dist/*.intoto.jsonl

  finalize-release:
    name: Finalize release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Upgrade release assets and publish the draft release.
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check draft release
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq .isDraft)" = true
      - name: Download timestamp
        run: |
          mkdir release
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern '*.ots' --dir release
      - name: Install OpenTimestamps
        run: |
          python3 -m venv "$RUNNER_TEMP/ots"
          "$RUNNER_TEMP/ots/bin/pip" install "opentimestamps-client==$OPENTIMESTAMPS_VERSION"
          echo "$RUNNER_TEMP/ots/bin" >> "$GITHUB_PATH"
      - name: Upgrade timestamp
        run: |
          ots upgrade release/*.ots
      - name: Upload upgraded timestamp
        run: |
          gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" --clobber release/*.ots
      - name: Publish release
        run: |
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false
