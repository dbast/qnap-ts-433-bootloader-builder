exclude: .*\.patch
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49  # frozen: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix, --show-fixes]
      - id: ruff-format
  - repo: https://github.com/reteps/dockerfmt
    rev: 5c9b576cff2b0f3c323785ed9aa86838d1ae2228  # frozen: v0.5.4
    hooks:
      - id: dockerfmt
        args: [--newline, --write]
  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: 4380fbb73a154b5f5624794c1c78d9719ccc860f  # frozen: v2.16.0
    hooks:
      - id: pretty-format-toml
        args: [--autofix, --trailing-commas]
      - id: pretty-format-yaml
        args: [--autofix, --offset, '2']
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8  # frozen: 0.38.0
    hooks:
      - id: check-github-workflows
      - id: check-renovate
      - id: check-jsonschema
        name: validate CycloneDX SBOM
        args:
          - --schemafile
          - https://cyclonedx.org/schema/bom-1.6.schema.json
        files: ^sbom\.cdx\.json$
  - repo: https://github.com/executablebooks/mdformat
    rev: 82912cdaea4fb830f751504486a7879c70526547  # frozen: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0
  - repo: https://github.com/google/keep-sorted
    rev: b225c42a9a8f480d760cf967d1e3a839060b242c  # frozen: v0.10.0
    hooks:
      - id: keep-sorted
  - repo: https://github.com/crate-ci/typos
    rev: 4d9c206a77c041268485162b8e2579ad7a5cb9a3  # frozen: v1.50.0
    hooks:
      - id: typos
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: cef8b8350da46d8114c7e6b7272aebdccdf193ce  # frozen: v1.30.0
    hooks:
      - id: zizmor
        args: [--no-progress, --persona=auditor, --fix]
  - repo: local
    hooks:
      - id: sbom
        name: regenerate SBOM
        entry: python3 sbom.py
        language: system
        pass_filenames: false
        files: ^(\.gitmodules|Makefile|sbom\.py|sbom\.cdx\.json|rkbin|trusted-firmware-a|u-boot)$
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
